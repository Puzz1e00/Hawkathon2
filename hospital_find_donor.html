<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Donor - Hospital Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: linear-gradient(to bottom, #16a34a, #15803d);
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            transition: all 0.3s;
            z-index: 100;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-menu {
            padding: 20px 0;
        }
        
        .sidebar-menu a {
            display: block;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
            border-left: 4px solid transparent;
        }
        
        .sidebar-menu a:hover {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid white;
        }
        
        .sidebar-menu a.active {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid white;
        }
        
        .sidebar-menu i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
        
        .main-content {
            margin-left: 250px;
            padding: 2rem;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="homepage.html" class="text-2xl font-bold text-white">DonorSync</a>
        </div>
        
        <div class="sidebar-menu">
            <a href="homepage.html">
                <i class="fas fa-home"></i> Home
            </a>
            <a href="hospital.html">
                <i class="fas fa-hospital"></i> Dashboard
            </a>
            <a href="hospital_find_donor.html" class="active">
                <i class="fas fa-search"></i> Find Donor
            </a>
            <a href="donor_map.html">
                <i class="fas fa-map-marker-alt"></i> Donor Map
            </a>
            <a href="#" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Find Donor</h1>
                <div class="flex items-center space-x-4">
                    <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-medium">
                        <i class="fas fa-hospital mr-1"></i> <span id="hospitalName">Hospital</span>
                    </span>
                </div>
            </div>

            <!-- Search Section -->
            <div class="bg-white rounded-xl shadow-md p-6 mb-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Search Donors</h2>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Search by Name</label>
                        <input type="text" id="searchInput" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
                            placeholder="Enter donor name...">
                    </div>
                    <div class="flex items-end">
                        <button id="searchBtn" 
                            class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
                            <i class="fas fa-search mr-2"></i>Search
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-800">Search Results</h2>
                    <span id="resultCount" class="text-sm text-gray-500">0 donors found</span>
                </div>
                
                <!-- Donors Table -->
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Donor ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Blood Type</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Donation</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total Donations</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="donorsTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- Results will be populated here -->
                        </tbody>
                    </table>
                </div>

                <!-- No Results Message -->
                <div id="noResults" class="hidden text-center py-8">
                    <i class="fas fa-search text-gray-400 text-4xl mb-4"></i>
                    <p class="text-gray-500">No donors found matching your search criteria</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if hospital is logged in
            const hospitalId = sessionStorage.getItem('loggedInHospitalId');
            if (!hospitalId) {
                window.location.href = 'hospital_login.html';
                return;
            }

            // Get hospital data
            const hospitals = JSON.parse(localStorage.getItem('hospitals')) || [];
            const hospital = hospitals.find(h => h.id === parseInt(hospitalId));
            
            if (!hospital) {
                window.location.href = 'hospital_login.html';
                return;
            }

            // Set hospital name
            document.getElementById('hospitalName').textContent = hospital.name || 'Hospital';

            // Initialize test donor data if none exists
            let donors = JSON.parse(localStorage.getItem('donors')) || [];
            if (donors.length === 0) {
                console.log('Initializing test donor data');
                donors = [
                    {
                        id: "D001",
                        name: "John Doe",
                        bloodGroup: "O+",
                        medicalConditions: "",
                        weight: "70",
                        height: "175",
                        donationHistory: []
                    },
                    {
                        id: "D002",
                        name: "Jane Smith",
                        bloodGroup: "A+",
                        medicalConditions: "",
                        weight: "65",
                        height: "165",
                        donationHistory: []
                    }
                ];
                localStorage.setItem('donors', JSON.stringify(donors));
            }

            // Function to format date
            function formatDate(dateString) {
                if (!dateString) return 'Never';
                const date = new Date(dateString);
                return date.toLocaleDateString();
            }

            // Function to render donor row
            function renderDonorRow(donor) {
                const lastDonation = donor.donationHistory && donor.donationHistory.length > 0 
                    ? donor.donationHistory[donor.donationHistory.length - 1]
                    : null;

                return `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${donor.id}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${donor.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${donor.bloodGroup || 'Unknown'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formatDate(lastDonation?.date)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${donor.donationHistory?.length || 0}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <a href="hospital_update_donor.html?id=${donor.id}" 
                               class="text-green-600 hover:text-green-900"
                               onclick="console.log('Clicking update for donor:', '${donor.id}')">
                                Update Details
                            </a>
                        </td>
                    </tr>
                `;
            }

            // Function to perform search
            function performSearch() {
                const searchQuery = document.getElementById('searchInput').value.toLowerCase();
                
                const filteredDonors = donors.filter(donor => 
                    donor.name.toLowerCase().includes(searchQuery)
                );

                const tableBody = document.getElementById('donorsTableBody');
                const noResults = document.getElementById('noResults');
                const resultCount = document.getElementById('resultCount');

                if (filteredDonors.length === 0) {
                    tableBody.innerHTML = '';
                    noResults.classList.remove('hidden');
                    resultCount.textContent = '0 donors found';
                } else {
                    tableBody.innerHTML = filteredDonors.map(renderDonorRow).join('');
                    noResults.classList.add('hidden');
                    resultCount.textContent = `${filteredDonors.length} donor${filteredDonors.length === 1 ? '' : 's'} found`;
                }
            }

            // Add event listeners
            document.getElementById('searchBtn').addEventListener('click', performSearch);
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });

            // Initial search to show all donors
            performSearch();

            // Handle logout
            document.getElementById('logoutBtn').addEventListener('click', function(e) {
                e.preventDefault();
                sessionStorage.removeItem('loggedInHospitalId');
                window.location.href = 'hospital_login.html';
            });
        });
    </script>
</body>
</html>
