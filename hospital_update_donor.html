<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Donor - Hospital Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: linear-gradient(to bottom, #16a34a, #15803d);
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            transition: all 0.3s;
            z-index: 100;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-menu {
            padding: 20px 0;
        }
        
        .sidebar-menu a {
            display: block;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
            border-left: 4px solid transparent;
        }
        
        .sidebar-menu a:hover {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid white;
        }
        
        .sidebar-menu a.active {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid white;
        }
        
        .sidebar-menu i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
        
        .main-content {
            margin-left: 250px;
            padding: 2rem;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="homepage.html" class="text-2xl font-bold text-white">DonorSync</a>
        </div>
        
        <div class="sidebar-menu">
            <a href="homepage.html">
                <i class="fas fa-home"></i> Home
            </a>
            <a href="hospital.html">
                <i class="fas fa-hospital"></i> Dashboard
            </a>
            <a href="hospital_update_donor.html" class="active">
                <i class="fas fa-user-edit"></i> Update Donor
            </a>
            <a href="hospital_find_donor.html">
                <i class="fas fa-search"></i> Find Donor
            </a>
            <a href="donor_map.html">
                <i class="fas fa-map-marker-alt"></i> Donor Map
            </a>
            <a href="#" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Update Donor Details</h1>
                <div class="flex items-center space-x-4">
                    <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-medium">
                        <i class="fas fa-hospital mr-1"></i> <span id="hospitalName">Hospital</span>
                    </span>
                </div>
            </div>

            <!-- Donor Details Section -->
            <div class="bg-white rounded-xl shadow-md p-6 mb-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Donor Information</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Donor ID</label>
                        <input type="text" id="donorId" readonly
                            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                        <input type="text" id="donorName" readonly
                            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Blood Type</label>
                        <input type="text" id="bloodType" readonly
                            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Medical Conditions</label>
                        <input type="text" id="medicalConditions" readonly
                            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md">
                    </div>
                </div>
            </div>

            <!-- Add Donation Record Section -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Add Donation Record</h2>
                <form id="donationForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Date of Donation</label>
                            <input type="date" id="donationDate" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Blood Units</label>
                            <input type="number" id="bloodUnits" min="1" max="5" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Donation Type</label>
                            <select id="donationType" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                                <option value="">Select Type</option>
                                <option value="Whole Blood">Whole Blood</option>
                                <option value="Plasma">Plasma</option>
                                <option value="Platelets">Platelets</option>
                                <option value="Double Red Cell">Double Red Cell</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Notes</label>
                            <textarea id="donationNotes" rows="3"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
                                placeholder="Any additional notes about the donation..."></textarea>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button type="submit"
                            class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
                            Add Donation Record
                        </button>
                    </div>
                </form>
            </div>

            <!-- Donation History Section -->
            <div class="bg-white rounded-xl shadow-md p-6 mt-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Donation History</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Blood Units</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Donation Type</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Notes</th>
                            </tr>
                        </thead>
                        <tbody id="donationHistoryBody" class="bg-white divide-y divide-gray-200">
                            <!-- Donation history will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if hospital is logged in
            const hospitalId = sessionStorage.getItem('loggedInHospitalId');
            if (!hospitalId) {
                window.location.href = 'hospital_login.html';
                return;
            }

            // Get hospital data
            const hospitals = JSON.parse(localStorage.getItem('hospitals')) || [];
            const hospital = hospitals.find(h => h.id === parseInt(hospitalId));
            
            if (!hospital) {
                window.location.href = 'hospital_login.html';
                return;
            }

            // Set hospital name
            document.getElementById('hospitalName').textContent = hospital.name || 'Hospital';

            // Get donor ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const donorId = urlParams.get('id');

            console.log('Donor ID from URL:', donorId);

            if (!donorId) {
                alert('No donor ID provided');
                window.location.href = 'hospital_find_donor.html';
                return;
            }

            // Get donor data from localStorage
            let donors = JSON.parse(localStorage.getItem('donors')) || [];
            console.log('All donors:', donors);

            // If no donors exist, initialize with test data
            if (donors.length === 0) {
                donors = [
                    {
                        id: "D001",
                        name: "John Doe",
                        bloodGroup: "O+",
                        medicalConditions: "",
                        weight: "70",
                        height: "175",
                        donationHistory: []
                    },
                    {
                        id: "D002",
                        name: "Jane Smith",
                        bloodGroup: "A+",
                        medicalConditions: "",
                        weight: "65",
                        height: "165",
                        donationHistory: []
                    }
                ];
                localStorage.setItem('donors', JSON.stringify(donors));
            }

            // Find the donor
            const donor = donors.find(d => String(d.id).trim().toLowerCase() === donorId.trim().toLowerCase());
            console.log('Attempting to find donor with ID (trimmed, lowercased): ', donorId.trim().toLowerCase());
            console.log('Found donor:', donor);

            if (!donor) {
                alert('Donor not found');
                window.location.href = 'hospital_find_donor.html';
                return;
            }

            // Populate donor details
            document.getElementById('donorId').value = donor.id || '';
            document.getElementById('donorName').value = donor.name || '';
            document.getElementById('bloodType').value = donor.bloodGroup || 'Unknown';
            document.getElementById('medicalConditions').value = donor.healthConditions || 'None';

            // Function to format date
            function formatDate(dateString) {
                if (!dateString) return 'N/A';
                const date = new Date(dateString);
                return date.toLocaleDateString();
            }

            // Function to render donation history
            function renderDonationHistory() {
                const historyBody = document.getElementById('donationHistoryBody');
                if (!donor.donationHistory || donor.donationHistory.length === 0) {
                    historyBody.innerHTML = `
                        <tr>
                            <td colspan="3" class="px-6 py-4 text-center text-gray-500">
                                No donation history available
                            </td>
                        </tr>
                    `;
                    return;
                }

                historyBody.innerHTML = donor.donationHistory
                    .sort((a, b) => new Date(b.date) - new Date(a.date))
                    .map(donation => `
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                ${formatDate(donation.date)}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                ${donation.units} units
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                ${donation.type || 'N/A'}
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-500">
                                ${donation.notes || 'N/A'}
                            </td>
                        </tr>
                    `).join('');
            }

            // Initial render of donation history
            renderDonationHistory();

            // Handle donation form submission
            document.getElementById('donationForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const donationDate = document.getElementById('donationDate').value;
                const bloodUnits = document.getElementById('bloodUnits').value;
                const donationType = document.getElementById('donationType').value;
                const notes = document.getElementById('donationNotes').value;

                // Create new donation record
                const newDonation = {
                    date: donationDate,
                    units: parseInt(bloodUnits),
                    type: donationType,
                    notes: notes,
                    hospitalId: parseInt(hospitalId)
                };

                // Add to donor's donation history
                if (!donor.donationHistory) {
                    donor.donationHistory = [];
                }
                donor.donationHistory.push(newDonation);

                // Update donors in localStorage
                const donorIndex = donors.findIndex(d => d.id === donor.id);
                donors[donorIndex] = donor;
                localStorage.setItem('donors', JSON.stringify(donors));

                // Also update currentUser if this is the logged-in donor
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                if (currentUser && currentUser.id === donor.id) {
                    // Update the entire donor object in currentUser to ensure all properties are in sync
                    currentUser.donationHistory = donor.donationHistory;
                    currentUser.badges = donor.badges || [];
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                }

                // Reset form
                e.target.reset();

                // Update donation history display
                renderDonationHistory();

                // Show success message and redirect
                alert('Donation record added successfully!');
                
                // Force a page reload when redirecting to ensure badges are recalculated
                window.location.href = 'donor_home.html';
            });

            // Handle logout
            document.getElementById('logoutBtn').addEventListener('click', function(e) {
                e.preventDefault();
                sessionStorage.removeItem('loggedInHospitalId');
                window.location.href = 'hospital_login.html';
            });
        });
    </script>
</body>
</html>
